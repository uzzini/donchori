<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f2" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="오늘도, 더 나은 내일을 위한 가계부" />
    <title>돈초리</title>
    <script>
      // 첫 화면 깜빡임 방지: React가 뜨기 전에 저장된 테마를 light/dark로 풀어서 먼저 적용
      try {
        var saved = JSON.parse(localStorage.getItem('donchori-theme') || '{}');
        var theme = (saved.state && saved.state.theme) || 'system';
        if (theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#171513' : '#faf8f2');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
